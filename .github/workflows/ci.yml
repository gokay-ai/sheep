name: CI

on:
  push:
    branches: [main]
  pull_request:

# Only the checkout is needed; nothing here writes to the repository.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Linux and macOS, because those are the two platforms anything in this
  # repository claims. There was a `windows-latest` leg here; it had never
  # compiled — `tests/tui_flow.rs` used `std::os::unix::fs::PermissionsExt`
  # ungated and `wire::REQUEST_TIMEOUT` is dead code without a unix socket to
  # time out — so it was red on every push, which is exactly why nobody noticed
  # that the recorder could not record a single turn there. Sheep no longer
  # declares Windows in the plugin manifest and no longer publishes a Windows
  # binary; a gate for a platform nothing claims is a gate nobody reads. It
  # comes back with the named-pipe transport, alongside the claim.
  check:
    name: fmt + clippy + test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --check

      # Both legs run clippy on purpose: `-D warnings` fires on different code
      # per platform, and macOS and Linux already differ enough to be worth it.
      - run: cargo clippy --all-targets --locked -- -D warnings

      - run: cargo test --locked

  plugin:
    name: plugin manifest + installer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: shellcheck
        run: shellcheck herdr-plugin/install.sh herdr-plugin/scripts/*.sh

      # Exercises install.sh's platform detection against faked uname output and
      # cross-checks the asset names it resolves against the target list in
      # release.yml. That round trip is the thing most likely to silently rot:
      # rename a target in the release matrix and this fails on the next push
      # rather than on the next user's install.
      - name: installer platform detection
        run: bash herdr-plugin/scripts/test-install.sh

      # herdr dispatches hooks concurrently and both of Sheep's event hooks
      # call `watchd.sh start`, so "exactly one recorder" is a race, and a race
      # is not something a reviewer sees in a diff. Eight starts at once, then a
      # count. It also asserts `stop` sweeps orphans and that `status` names the
      # log the recorder actually writes turns to.
      - name: the recorder daemon keeps exactly one recorder
        run: bash herdr-plugin/scripts/test-watchd.sh

      - name: manifest and crate versions agree
        run: |
          set -eu
          crate=$(sed -n 's/^version *= *"\([^"]*\)".*/\1/p' Cargo.toml | head -n 1)
          manifest=$(sed -n 's/^version *= *"\([^"]*\)".*/\1/p' herdr-plugin/herdr-plugin.toml | head -n 1)
          echo "crate=$crate manifest=$manifest"
          test "$crate" = "$manifest"
