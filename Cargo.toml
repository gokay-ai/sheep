[package]
name = "sheep"
version = "0.1.1"
edition = "2021"
rust-version = "1.85"
description = "Undo for AI coding agents. Every agent turn becomes a restorable checkpoint."
license = "MIT"
readme = "README.md"
repository = "https://github.com/gokay-ai/sheep"
homepage = "https://github.com/gokay-ai/sheep"
keywords = ["git", "tui", "undo", "herdr", "agents"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
crossterm = "0.29.0"
ratatui = "0.29.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
