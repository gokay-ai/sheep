# --- sheep-keys ---
# Appended to ~/.config/herdr/config.toml by herdr-plugin/install.sh.
# herdr 0.8 does not load [[keys.command]] from a plugin manifest, so these
# live in your config. prefix+f is rewind, prefix+F is the dock — neither is a
# herdr default (zoom stays on prefix+z). Delete this block and run
# `herdr server reload-config` to drop the bindings; uninstalling the plugin
# does not remove them.

[[keys.command]]
key = "prefix+f"
type = "plugin_action"
command = "sheep.rewind"
description = "rewind this agent"

[[keys.command]]
key = "prefix+F"
type = "plugin_action"
command = "sheep.dock"
description = "show the Sheep timeline"
