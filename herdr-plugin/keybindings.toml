# Sheep's keybindings, ready to paste into ~/.config/herdr/config.toml.
#
# They live here rather than only in herdr-plugin.toml because herdr 0.8 reads
# keybindings from the user's config.toml alone: the plugin manifest loader has
# no `keys` field, so the identical block in herdr-plugin.toml is accepted but
# never reaches the key map. Paste this in and run `herdr server reload-config`.
#
# `prefix` is whatever your config's prefix key is (Ctrl+a out of the box).

[[keys.command]]
key = "prefix+z"
type = "plugin_action"
command = "sheep.rewind"
description = "rewind this agent"

[[keys.command]]
key = "prefix+Z"
type = "plugin_action"
command = "sheep.dock"
description = "show the Sheep timeline"

# On Windows the action ids carry a `-windows` suffix — herdr rejects duplicate
# action ids even when the two entries are gated to different platforms — so use
# these two lines there instead of the pair above.
#
# [[keys.command]]
# key = "prefix+z"
# type = "plugin_action"
# command = "sheep.rewind-windows"
# description = "rewind this agent"
#
# [[keys.command]]
# key = "prefix+Z"
# type = "plugin_action"
# command = "sheep.dock-windows"
# description = "show the Sheep timeline"
